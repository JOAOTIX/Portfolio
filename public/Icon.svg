<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- Fondo con bordes suavemente redondeados -->
  <rect width="192" height="192" rx="44" fill="#0f172a"/>
  
  <!-- Definición del gradiente Cyan-Teal -->
  <defs>
    <linearGradient id="jGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" /> <!-- Cyan -->
      <stop offset="100%" stop-color="#0d9488" /> <!-- Teal -->
    </linearGradient>
  </defs>
  
  <!-- Texto centrado con tipografía de código -->
  <text 
    x="50%" 
    y="56%" 
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" 
    font-weight="900" 
    font-size="76" 
    fill="url(#jGrad)" 
    text-anchor="middle" 
    dominant-baseline="middle"
    letter-spacing="-2"
  >
    &lt;J/&gt;
  </text>
</svg>
